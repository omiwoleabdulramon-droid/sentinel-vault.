<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGICSTACK | SENTINEL V3.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e5e5e5; font-family: 'Inter', sans-serif; }
        .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f9e27d 50%, #b8860b 100%); }
        .glass-card { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px); }
        .gold-glow:hover { box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .intel-btn { border: 1px solid #3b82f6; color: #3b82f6; }
        .terminal-text { font-family: 'Courier New', Courier, monospace; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-xl mx-auto space-y-6">
        
        <div class="flex justify-between items-center border-b border-yellow-900/30 pb-4">
            <div>
                <h1 class="text-[10px] tracking-[0.3em] text-yellow-500 font-bold uppercase terminal-text">LogicStack Systems</h1>
                <p class="text-xl font-light italic text-white">Sentinel <span class="font-bold not-italic">V3.2 Intel</span></p>
            </div>
            <div class="px-3 py-1 rounded border border-yellow-600/30 text-[10px] text-yellow-600 font-bold">ENCRYPTED</div>
        </div>

        <div class="glass-card p-5 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
                <label class="text-[9px] uppercase text-yellow-600 font-bold terminal-text">Bulk Target Input</label>
                <span id="queueCount" class="text-[9px] text-gray-500 font-bold">0 LOADED</span>
            </div>
            <textarea id="bulkInput" rows="4" class="w-full bg-black/40 border border-white/5 rounded-xl p-4 text-sm focus:outline-none focus:border-yellow-600 transition-all text-white" placeholder="Paste lead list..."></textarea>
            
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setChannel('whatsapp')" id="btn-whatsapp" class="text-[9px] py-2 rounded-lg border border-yellow-600/50 bg-yellow-950/20 text-yellow-500 font-bold">WHATSAPP</button>
                <button onclick="setChannel('sms')" id="btn-sms" class="text-[9px] py-2 rounded-lg border border-white/10 bg-white/5 text-gray-500 font-bold opacity-60">SMS</button>
                <button onclick="setChannel('email')" id="btn-email" class="text-[9px] py-2 rounded-lg border border-white/10 bg-white/5 text-gray-500 font-bold opacity-60">EMAIL</button>
            </div>
        </div>

        <div class="glass-card p-8 rounded-3xl text-center space-y-6">
            <div class="space-y-1">
                <div id="statusLabel" class="text-[8px] text-yellow-500/40 font-bold uppercase tracking-[0.3em]">Active Identification</div>
                <div id="currentLeadDisplay" class="text-3xl font-black tracking-tighter text-white py-2 font-mono uppercase">---</div>
                <div id="queueProgress" class="text-[9px] text-gray-600 font-bold">STANDBY MODE</div>
            </div>

            <div class="space-y-3">
                <button onclick="executeHandshake()" class="gold-gradient w-full py-5 rounded-2xl text-black font-black uppercase tracking-[0.2em] text-xs gold-glow transition-all active:scale-95">Initiate Handshake</button>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="researchLead()" class="intel-btn py-3 rounded-xl text-[9px] font-bold uppercase tracking-widest">Deep Intel (Google)</button>
                    <button onclick="nextLead()" class="bg-white/5 py-3 rounded-xl text-[9px] text-gray-400 font-bold uppercase border border-white/5">Skip Target</button>
                </div>
            </div>
        </div>

        <div class="text-center opacity-20 text-[8px] tracking-[0.4em] uppercase font-bold text-yellow-500">Core Engine V3.2</div>
    </div>

    <script>
        let leads = []; let currentIndex = 0; let channel = 'whatsapp';
        const bulkInput = document.getElementById('bulkInput');
        const leadDisplay = document.getElementById('currentLeadDisplay');
        const queueProgress = document.getElementById('queueProgress');
        const queueCount = document.getElementById('queueCount');

        bulkInput.addEventListener('input', () => {
            leads = bulkInput.value.split(/[\n,]+/).map(l => l.trim()).filter(l => l !== "");
            currentIndex = 0; updateDisplay();
        });

        function setChannel(choice) {
            channel = choice;
            ['whatsapp', 'sms', 'email'].forEach(c => {
                const btn = document.getElementById('btn-' + c);
                btn.style.opacity = (c === choice) ? "1" : "0.6";
            });
        }

        function updateDisplay() {
            if (leads.length > 0) {
                leadDisplay.innerText = leads[currentIndex];
                queueProgress.innerText = `QUEUED: ${currentIndex + 1} OF ${leads.length}`;
                queueCount.innerText = `${leads.length} LOADED`;
            } else {
                leadDisplay.innerText = "---"; queueProgress.innerText = "STANDBY MODE";
            }
        }

        function nextLead() {
            if (currentIndex < leads.length - 1) { currentIndex++; updateDisplay(); }
            else { alert("Queue Complete."); }
        }

        function researchLead() {
            const lead = leads[currentIndex];
            window.open(`https://www.google.com/search?q=%22${lead.replace(/\D/g,'')}%22`, '_blank');
        }

        function executeHandshake() {
            const lead = leads[currentIndex];
            const msg = encodeURIComponent("Hey, reaching out regarding the property. Still available?");
            let url = (channel === 'whatsapp') ? `https://wa.me/${lead.replace(/\D/g,'')}?text=${msg}` : `sms:${lead.replace(/\D/g,'')}?body=${msg}`;
            window.open(url, '_blank');
            setTimeout(nextLead, 1500);
        }
    </script>
</body>
        </html>
